name: CI

on:
  push:
    paths:
      - "app/TeamkiezeerKit/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  swift-tests:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Run TeamkiezeerKit tests
        working-directory: app/TeamkiezeerKit
        run: swift test
