name: CI

on:
  push:
    paths:
      - "app/TeamkiezeerKit/**"
      - "pipeline/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Run TeamkiezeerKit tests
        working-directory: app/TeamkiezeerKit
        run: swift test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run pipeline tests (against committed snapshots)
        run: python -m pytest pipeline/tests -q
