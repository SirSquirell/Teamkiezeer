name: Build teams.json

on:
  schedule:
    # 08:00 Europe/Amsterdam. Cron is UTC en volgt de zomertijd niet automatisch:
    # 06:00 UTC = 08:00 tijdens CEST (eind maart-eind oktober); tijdens CET
    # (winter) komt dit binnen op 07:00 lokaal. Zet dan naar "0 7 * * *" terug.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "data/national-teams.json"
      - ".github/workflows/data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Een push bouwt de gepushte ref (altijd main); de dagelijkse run en een
          # handmatige start bouwen expliciet main, nooit een toevallige branch.
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # De pytest-suite draait in ci.yml en bewaakt merges; hier bewaakt
      # audit.py (in build_teams.py, faalt hard) de live data.
      - name: Build teams.json (live scrape)
        run: python pipeline/build_teams.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/teams.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in data/teams.json"
          else
            git commit -m "Update teams.json from daily scrape"
            # De snapshot-workflow kan in dezelfde minuut op main hebben gepusht
            # (2026-09-02: build geslaagd, push afgewezen met "fetch first").
            # Eerst binnenhalen, dan pas pushen; teams.json is het enige bestand
            # dat deze job aanraakt, dus de rebase kan niet conflicteren.
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push
          fi

      - name: Sluit het faal-issue als de build weer slaagt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITEL="Databuild mislukt"
          gh issue list --state open --search "in:title \"$TITEL\"" --json number,title \
            --jq ".[] | select(.title == \"$TITEL\") | .number" | while read -r nr; do
            gh issue close "$nr" --comment "De build slaagt weer: $RUN_URL"
          done

      - name: Open een issue als het misging
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITEL="Databuild mislukt"
          if [ -n "$(gh issue list --state open --search "in:title \"$TITEL\"" --json title --jq ".[] | select(.title == \"$TITEL\") | .title")" ]; then
            echo "Er staat al een open issue '$TITEL'; geen tweede."
            exit 0
          fi
          BODY="De dagelijkse databuild is mislukt. Zie de run: $RUN_URL"
          BODY="$BODY"$'\n\n'"De app en de site blijven op de laatste goede data/teams.json staan; er is niets gecommit."
          gh issue create --title "$TITEL" --body "$BODY"
